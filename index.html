// ---- 시간 계산: 보는 사람의 시간대와 관계없이 한국 시간 기준 ----
function kstNow() {
  const parts = new Intl.DateTimeFormat("en-US", {
    timeZone: "Asia/Seoul", weekday: "short", hour: "2-digit", minute: "2-digit", hourCycle: "h23"
  }).formatToParts(new Date());
  const get = t => parts.find(p => p.type === t).value;
  const day = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(get("weekday"));
  return { day, min: (+get("hour")) * 60 + (+get("minute")) };
}
const toMin = s => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };

// 영업시간 기준 추정. 반환: {state: "open"|"soon"|"closed", text}
function scheduleStatus(stall, now) {
  const today = stall.hours[now.day];
  const yday = stall.hours[(now.day + 6) % 7];
  if (yday) {
    const o = toMin(yday[0]), c = toMin(yday[1]);
    if (c < o && now.min < c) return closingText(c - now.min, yday[1]);
  }
  if (today) {
    const o = toMin(today[0]), c = toMin(today[1]);
    const overnight = c < o;
    if (now.min >= o && (overnight || now.min < c)) {
      return closingText(overnight ? (1440 - now.min + c) : (c - now.min), today[1]);
    }
    if (now.min < o) {
      const wait = o - now.min;
      if (wait <= 60) return { state: "soon", text: `${wait}분 뒤 오픈 (${today[0]})` };
      return { state: "closed", text: `오늘 ${today[0]} 오픈` };
    }
  }
  for (let i = 1; i <= 7; i++) {
    const d = (now.day + i) % 7, h = stall.hours[d];
    if (h) return { state: "closed", text: `${i === 1 ? "내일" : DAYS[d] + "요일"} ${h[0]} 오픈` };
  }
  return { state: "closed", text: "영업 정보 없음" };
}
function closingText(left, closeAt) {
  if (left <= 30) return { state: "soon", text: `곧 마감 (${closeAt}까지)` };
  return { state: "open", text: `영업중 · ${closeAt}까지` };
}

function authHeaders() {
  const h = { apikey: SUPABASE_ANON_KEY };
  if (SUPABASE_ANON_KEY.startsWith("eyJ")) h.Authorization = `Bearer ${SUPABASE_ANON_KEY}`;
  return h;
}
async function fetchRemote() {
  if (!REMOTE) return;
  const since = new Date(Date.now() - 24 * 3600 * 1000).toISOString();
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/reports?select=stall_id,is_open,created_at&created_at=gte.${since}&order=created_at.desc&limit=2000`,
      { headers: authHeaders() });
    if (!r.ok) throw new Error(r.status);
    const next = {};
    for (const row of await r.json()) (next[row.stall_id] = next[row.stall_id] || []).push({ open: row.is_open, at: Date.parse(row.created_at) });
    remoteReports = next;
  } catch (e) { console.warn("제보 불러오기 실패", e); }
}
async function sendRemote(stallId, open) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/reports`, {
    method: "POST",
    headers: { ...authHeaders(),
               "Content-Type": "application/json", Prefer: "return=minimal" },
    body: JSON.stringify({ stall_id: stallId, is_open: open }),
  });
  if (!r.ok) throw new Error(r.status);
}

const FRESH_MIN = 120;  // 이 시간 안의 제보는 영업시간보다 우선
const STORE_KEY = "winter-snack-reports-v1";
const minutesAgo = m => Date.now() - m * 60000;
// 데모용 샘플 제보 (페이지를 열 때마다 "몇 분 전"으로 생성)
const SAMPLE_REPORTS = {
  1: [{ open: true, at: minutesAgo(8) }, { open: true, at: minutesAgo(35) }],
  4: [{ open: false, at: minutesAgo(20) }],
  11: [{ open: true, at: minutesAgo(15) }],
  12: [{ open: false, at: minutesAgo(50) }, { open: true, at: minutesAgo(140) }],
  16: [{ open: true, at: minutesAgo(5) }],
  9: [{ open: true, at: minutesAgo(300) }],
};
function loadMine() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch { return {}; }
}
function saveMine(m) { try { localStorage.setItem(STORE_KEY, JSON.stringify(m)); } catch {} }
let myReports = loadMine();
function reportsFor(id) {
  const src = REMOTE ? (remoteReports[id] || []) : [...(SAMPLE_REPORTS[id] || []), ...(myReports[id] || [])];
  return [...src].sort((a, b) => b.at - a.at);
}
function ago(ts) {
  const m = Math.max(0, Math.round((Date.now() - ts) / 60000));
  if (m < 1) return "방금";
  if (m < 60) return `${m}분 전`;
  if (m < 60 * 24) return `${Math.floor(m / 60)}시간 전`;
  return `${Math.floor(m / 1440)}일 전`;
}

// 제보 + 영업시간을 합친 최종 상태
function status(stall, now) {
  const sched = scheduleStatus(stall, now);
  const reps = reportsFor(stall.id);
  const latest = reps[0];
  const fresh = latest && (Date.now() - latest.at) / 60000 <= FRESH_MIN;
  if (fresh) {
    return {
      state: latest.open ? "open" : "closed",
      text: latest.open ? "영업중 (제보)" : "닫힘 (제보)",
      report: `🙋 ${ago(latest.at)} 손님 제보: ${latest.open ? "열려 있어요" : "닫혀 있어요"}`,
      fresh: true, sched,
    };
  }
  return {
    ...sched, sched,
    report: latest ? `마지막 제보 ${ago(latest.at)} (${latest.open ? "열림" : "닫힘"}) · 영업시간 기준 추정` : "아직 제보 없음 · 영업시간 기준 추정",
    fresh: false,
  };
}

// ---- 지도 ----
const map = L.map("map", { zoomControl: true }).setView([37.545, 126.98], 12);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

const markers = {};
let filterType = "all", openOnly = false, query = "", userPos = null, activeId = null;

function icon(stall, st) {
  const emoji = filterType !== "all" && stall.types.includes(filterType) ? EMOJI[filterType] : EMOJI[stall.types[0]];
  return L.divIcon({ className: "", html: `<div class="pin ${st.state}"><span>${emoji}</span></div>`,
    iconSize: [30, 30], iconAnchor: [15, 30], popupAnchor: [0, -28] });
}
function distKm(a, b) {
  const R = 6371, r = x => x * Math.PI / 180;
  const dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
  const h = Math.sin(dLat/2)**2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

function hoursTable(stall, now) {
  return `<table class="hours">` + [1,2,3,4,5,6,0].map(d => {
    const h = stall.hours[d];
    return `<tr class="${d === now.day ? "today" : ""}"><td>${DAYS[d]}</td><td>${h ? h[0] + " – " + h[1] : "휴무"}</td></tr>`;
  }).join("") + "</table>";
}
function reportBox(stall, st) {
  const recent = reportsFor(stall.id).slice(0, 4);
  return `<div class="report-box">
    <div class="q">지금 이 가게 앞이세요? 영업 여부를 알려주세요.</div>
    <button class="yes" data-report="${stall.id}" data-open="1">🟢 지금 열려 있어요</button>
    <button class="no" data-report="${stall.id}" data-open="0">⚪ 지금 닫혀 있어요</button>
    ${recent.length ? `<ul>${recent.map(r => `<li>${ago(r.at)} · ${r.open ? "열림" : "닫힘"}</li>`).join("")}</ul>` : ""}
    ${st.fresh ? `<div class="meta">영업시간 기준으로는: ${st.sched.text}</div>` : ""}
  </div>`;
}

function renderCats() {
  const el = document.getElementById("cats");
  el.innerHTML = [`<button class="chip" data-type="all" aria-pressed="${filterType === "all"}">전체</button>`,
    ...CATS.map(c => `<button class="chip" data-type="${c.key}" aria-pressed="${filterType === c.key}">${c.e} ${c.key}</button>`)].join("");
  el.querySelectorAll("[data-type]").forEach(b => b.addEventListener("click", () => {
    filterType = b.dataset.type; renderCats(); render();
  }));
}

function render() {
  const now = kstNow();
  const hh = String(Math.floor(now.min / 60)).padStart(2, "0"), mm = String(now.min % 60).padStart(2, "0");
  document.getElementById("now").textContent = `(지금 ${DAYS[now.day]}요일 ${hh}:${mm}, 한국 시간)`;

  let rows = STALLS.map(s => ({ s, st: status(s, now), d: userPos ? distKm(userPos, s) : null }));
  rows = rows.filter(({ s, st }) =>
    (filterType === "all" || s.types.includes(filterType)) &&
    (!openOnly || st.state !== "closed") &&
    (!query || (s.name + s.area + s.menu + s.types.join("")).includes(query)));
  const rank = { open: 0, soon: 1, closed: 2 };
  rows.sort((a, b) => userPos ? a.d - b.d
    : rank[a.st.state] - rank[b.st.state] || (b.st.fresh - a.st.fresh) || a.s.name.localeCompare(b.s.name, "ko"));

  Object.values(markers).forEach(m => map.removeLayer(m));
  for (const k in markers) delete markers[k];
  rows.forEach(({ s, st }) => {
    const m = markers[s.id] = L.marker([s.lat, s.lng], { icon: icon(s, st) }).addTo(map);
    m.bindPopup(`<b>${esc(s.name)}</b><br>${st.text}<br><small>${esc(st.report)}</small><br><small>${esc(s.menu)}</small>`);
    m.on("click", () => select(s.id, false));
  });

  const openCount = rows.filter(r => r.st.state !== "closed").length;
  const label = filterType === "all" ? "" : `${EMOJI[filterType]} ${filterType} · `;
  const list = document.getElementById("list");
  list.innerHTML = `<div class="summary">${label}${rows.length}곳 중 ${openCount}곳 영업중${userPos ? " · 가까운 순" : ""}</div>` +
    (rows.length ? rows.map(({ s, st, d }) => `
      <div class="card ${s.id === activeId ? "active" : ""}" data-id="${s.id}">
        <div class="top"><h3>${esc(s.name)}</h3><span class="badge ${st.state}">${st.text}</span></div>
        <div class="reportline ${st.fresh ? "" : "stale"}">${esc(st.report)}</div>
        <div class="meta">${esc(s.area)}${d != null ? ` · ${d < 1 ? Math.round(d * 1000) + "m" : d.toFixed(1) + "km"}` : ""}<br>${esc(s.menu)}</div>
        <div class="tags">${s.types.map(t => `<span class="tag">${EMOJI[t]} ${t}</span>`).join("")}<span class="tag">${esc(s.pay)}</span></div>
        <div class="detail">${hoursTable(s, now)}${reportBox(s, st)}</div>
      </div>`).join("")
    : `<div class="empty">조건에 맞는 가게가 없어요.</div>`);
  list.querySelectorAll(".card").forEach(el => el.addEventListener("click", () => select(+el.dataset.id, true)));
  list.querySelectorAll("[data-report]").forEach(b => b.addEventListener("click", async e => {
    e.stopPropagation();
    const id = +b.dataset.report, open = b.dataset.open === "1";
    const last = lastSent[id];
    if (last && Date.now() - last < 60 * 1000) { toast("같은 가게는 1분에 한 번만 제보할 수 있어요."); return; }
    lastSent[id] = Date.now();
    if (REMOTE) {
      try { await sendRemote(id, open); (remoteReports[id] = remoteReports[id] || []).push({ open, at: Date.now() }); }
      catch { delete lastSent[id]; toast("제보를 보내지 못했어요. 잠시 뒤 다시 시도해 주세요."); return; }
    } else {
      (myReports[id] = myReports[id] || []).push({ open, at: Date.now() });
      saveMine(myReports);
    }
    toast("제보 고마워요! 다른 손님들에게 도움이 돼요.");
    render();
  }));
}

function select(id, fromList) {
  activeId = activeId === id && fromList ? null : id;
  const s = STALLS.find(x => x.id === id);
  if (fromList && activeId) { map.setView([s.lat, s.lng], 15); }
  render();
  if (fromList && activeId) markers[id]?.openPopup();
  if (!fromList) document.querySelector(`.card[data-id="${id}"]`)?.scrollIntoView({ block: "nearest", behavior: "smooth" });
}
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2000);
}

// ---- 컨트롤 ----
document.getElementById("openOnly").addEventListener("click", e => {
  openOnly = !openOnly; e.currentTarget.setAttribute("aria-pressed", openOnly); render();
});
document.getElementById("q").addEventListener("input", e => { query = e.target.value.trim(); render(); });
document.getElementById("locate").addEventListener("click", e => {
  const btn = e.currentTarget;
  if (userPos) { userPos = null; btn.setAttribute("aria-pressed", false); render(); return; }
  if (!navigator.geolocation) { btn.textContent = "📍 위치 기능 없음"; return; }
  navigator.geolocation.getCurrentPosition(p => {
    userPos = { lat: p.coords.latitude, lng: p.coords.longitude };
    btn.setAttribute("aria-pressed", true);
    L.circleMarker([userPos.lat, userPos.lng], { radius: 7, color: "#2a6df4", fillOpacity: .9 }).addTo(map);
    map.setView([userPos.lat, userPos.lng], 14);
    render();
  }, () => btn.textContent = "📍 위치 권한 필요");
});

const lastSent = {};
renderCats();
render();
fetchRemote().then(render);
setInterval(async () => { await fetchRemote(); render(); }, 60 * 1000);
</script>
</body>
