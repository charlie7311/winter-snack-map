<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>겨울 간식 지도</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root {
    --bg: #fbf7f1; --panel: #ffffff; --text: #2b2118; --muted: #7a6a5b;
    --line: #eadfce; --accent: #c8741f; --open: #1f8a4c; --closed: #a3988c;
    --soon: #c98a00; --chip: #f3e9db; --report: #2a6df4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1612; --panel: #241d17; --text: #f2e8dc; --muted: #b0a08e;
      --line: #3a2f25; --accent: #e8954a; --open: #4cc584; --closed: #7d7166;
      --soon: #e3b23c; --chip: #33291f; --report: #7ea6ff;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1612; --panel: #241d17; --text: #f2e8dc; --muted: #b0a08e;
    --line: #3a2f25; --accent: #e8954a; --open: #4cc584; --closed: #7d7166;
    --soon: #e3b23c; --chip: #33291f; --report: #7ea6ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
  .cats { display: flex; gap: 6px; margin-top: 10px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; align-items: center; }
  .chip {
    border: 1px solid var(--line); background: var(--chip); color: var(--text);
    border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; white-space: nowrap; flex: none;
  }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  input[type=search] {
    flex: 1 1 160px; min-width: 0; padding: 7px 12px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); font-size: 14px;
  }
  main { flex: 1; display: flex; min-height: 0; }
  #map { flex: 1.4; min-height: 300px; }
  #list { flex: 1; overflow-y: auto; border-left: 1px solid var(--line); background: var(--panel); }
  @media (max-width: 760px) {
    main { flex-direction: column; }
    #map { flex: none; height: 42vh; }
    #list { border-left: none; border-top: 1px solid var(--line); }
  }
  .summary { padding: 10px 16px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--line); }
  .card { padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .card:hover, .card.active { background: var(--chip); }
  .card .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .card h3 { margin: 0; font-size: 16px; }
  .badge { font-size: 12px; font-weight: 600; white-space: nowrap; }
  .badge.open { color: var(--open); } .badge.closed { color: var(--closed); } .badge.soon { color: var(--soon); }
  .reportline { font-size: 12px; margin-top: 4px; color: var(--report); }
  .reportline.stale { color: var(--muted); }
  .meta { font-size: 13px; color: var(--muted); margin-top: 4px; line-height: 1.5; }
  .tags { margin-top: 6px; display: flex; gap: 4px; flex-wrap: wrap; }
  .tag { font-size: 12px; background: var(--chip); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; }
  .detail { display: none; margin-top: 8px; }
  .card.active .detail { display: block; }
  .hours { font-size: 12px; color: var(--muted); }
  .hours td { padding: 1px 8px 1px 0; }
  .hours tr.today td { color: var(--text); font-weight: 600; }
  .report-box { margin-top: 10px; padding: 10px; border: 1px dashed var(--line); border-radius: 10px; background: var(--panel); }
  .report-box .q { font-size: 13px; margin-bottom: 6px; }
  .report-box button {
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-size: 13px; cursor: pointer;
    background: var(--bg); color: var(--text); margin-right: 6px;
  }
  .report-box button.yes { border-color: var(--open); color: var(--open); }
  .report-box button.no { border-color: var(--closed); color: var(--muted); }
  .report-box ul { margin: 8px 0 0; padding: 0; list-style: none; font-size: 12px; color: var(--muted); }
  .pin {
    width: 30px; height: 30px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
    display: flex; align-items: center; justify-content: center; border: 2px solid #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,.35);
  }
  .pin span { transform: rotate(45deg); font-size: 15px; }
  .pin.open { background: var(--open); } .pin.soon { background: var(--soon); } .pin.closed { background: var(--closed); }
  .empty { padding: 24px 16px; color: var(--muted); font-size: 14px; }
  footer { font-size: 12px; color: var(--muted); padding: 8px 16px; border-top: 1px solid var(--line); background: var(--panel); }
  #toast {
    position: fixed; left: 50%; bottom: 48px; transform: translateX(-50%); z-index: 1000;
    background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 999px; font-size: 13px;
    opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  #toast.show { opacity: 1; }
  .chip.add { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .tag.new { color: var(--report); border-color: var(--report); }
  #pickBanner {
    display: none; position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 1100;
    background: var(--panel); border: 2px solid var(--accent); border-radius: 12px; padding: 10px 14px;
    font-size: 14px; box-shadow: 0 4px 16px rgba(0,0,0,.2); width: min(420px, calc(100% - 32px));
  }
  #pickBanner.show { display: block; }
  #pickBanner .row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  body.picking #map { cursor: crosshair; }
  #modal { display: none; position: fixed; inset: 0; z-index: 1200; background: rgba(0,0,0,.45); }
  #modal.show { display: flex; align-items: center; justify-content: center; padding: 16px; }
  #modal form {
    background: var(--panel); color: var(--text); border-radius: 14px; padding: 18px; width: min(480px, 100%);
    max-height: calc(100vh - 32px); overflow-y: auto; font-size: 14px;
  }
  #modal h2 { margin: 0 0 4px; font-size: 18px; }
  #modal label.f { display: block; margin-top: 12px; font-weight: 600; font-size: 13px; }
  #modal input[type=text], #modal input[type=time] {
    width: 100%; margin-top: 4px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font-size: 14px;
  }
  #modal input[type=time] { width: auto; }
  #modal .checks { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  #modal .checks label { border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: 13px; cursor: pointer; background: var(--chip); }
  #modal .checks input { margin: 0 4px 0 0; vertical-align: -1px; }
  #modal .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  #modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  #modal button { border-radius: 8px; padding: 8px 14px; font-size: 14px; cursor: pointer; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  #modal button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  #modal .err { color: #c0392b; font-size: 13px; margin-top: 8px; min-height: 1em; }
</style>
</head>
<body>
<header>
  <h1>🍠 겨울 간식 지도</h1>
  <p>붕어빵부터 군고구마까지, 지금 열린 겨울 간식 노점을 찾아보세요. <span id="now"></span></p>
  <div class="cats" id="cats"></div>
  <div class="controls">
    <button class="chip add" id="addStall">＋ 가게 등록</button>
    <button class="chip" id="openOnly" aria-pressed="false">지금 영업중만</button>
    <button class="chip" id="locate" aria-pressed="false">📍 내 주변</button>
    <input type="search" id="q" placeholder="가게·동네·메뉴 검색">
  </div>
</header>
<main>
  <div id="map"></div>
  <section id="list"></section>
</main>
<footer>아는 노점이 있으면 ＋ 가게 등록으로 알려 주세요. 영업 여부는 손님 제보를 우선으로 보여주고, 최근 제보가 없으면 등록된 영업시간으로 추정해요.</footer>
<div id="toast"></div>

<div id="pickBanner">
  <b>📍 지도에서 가게 위치를 눌러 주세요</b>
  <div class="hint" style="font-size:12px;color:var(--muted);margin-top:2px">확대해서 정확한 자리를 찍을수록 좋아요.</div>
  <div class="row">
    <button class="chip" id="pickMine">내 위치로 하기</button>
    <button class="chip" id="pickCancel">취소</button>
  </div>
</div>

<div id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <form id="stallForm" novalidate>
    <h2 id="modalTitle">새 가게 등록</h2>
    <div class="hint" id="pickedAt"></div>
    <label class="f" for="fName">가게 이름 *</label>
    <input type="text" id="fName" maxlength="40" placeholder="예: 신촌역 2번출구 붕어빵">
    <label class="f" for="fArea">동네</label>
    <input type="text" id="fArea" maxlength="40" placeholder="예: 서대문구 신촌">
    <label class="f">파는 것 * <span class="hint">(여러 개 골라도 돼요)</span></label>
    <div class="checks" id="fTypes"></div>
    <label class="f" for="fMenu">메뉴·가격</label>
    <input type="text" id="fMenu" maxlength="100" placeholder="예: 팥붕 3개 2,000원">
    <label class="f">결제</label>
    <div class="checks" id="fPay">
      <label><input type="checkbox" value="현금">현금</label>
      <label><input type="checkbox" value="카드">카드</label>
      <label><input type="checkbox" value="계좌이체">계좌이체</label>
    </div>
    <label class="f">영업시간</label>
    <div class="checks"><label><input type="checkbox" id="fNoHours">잘 몰라요</label></div>
    <div id="hoursBox">
      <div style="margin-top:6px"><input type="time" id="fOpen" value="15:00"> ~ <input type="time" id="fClose" value="21:00"></div>
      <div class="hint">자정을 넘기면 끝나는 시간을 더 이르게 적으면 돼요 (예: 18:00 ~ 01:00).</div>
      <label class="f">쉬는 요일</label>
      <div class="checks" id="fOff"></div>
    </div>
    <div class="err" id="fErr"></div>
    <div class="actions">
      <button type="button" id="fRepick">위치 다시 찍기</button>
      <button type="button" id="fCancel">취소</button>
      <button type="submit" class="primary" id="fSubmit">등록하기</button>
    </div>
  </form>
</div>

<script>
// ---- 카테고리 ----
const CATS = [
  { key: "붕어빵", e: "🐟" }, { key: "호떡", e: "🥞" }, { key: "군고구마", e: "🍠" },
  { key: "군밤", e: "🌰" }, { key: "계란빵", e: "🥚" }, { key: "국화빵", e: "🌼" },
  { key: "어묵", e: "🍢" }, { key: "타코야끼", e: "🐙" }, { key: "델리만쥬", e: "🧁" },
  { key: "땅콩과자", e: "🥜" }, { key: "와플", e: "🧇" }, { key: "옥수수", e: "🌽" },
];
const EMOJI = Object.fromEntries(CATS.map(c => [c.key, c.e]));

// hours: 요일별 [시작, 끝] (0=일 ... 6=토), null = 휴무. 끝이 시작보다 작으면 자정을 넘김.
let userStalls = [];               // 손님이 등록한 가게 (서버 또는 이 브라우저)
let STALLS = [];
function rebuildStalls() { STALLS = [...userStalls]; }
const DAYS = ["일", "월", "화", "수", "목", "금", "토"];

// ---- 시간 계산: 보는 사람의 시간대와 관계없이 한국 시간 기준 ----
function kstNow() {
  const parts = new Intl.DateTimeFormat("en-US", {
    timeZone: "Asia/Seoul", weekday: "short", hour: "2-digit", minute: "2-digit", hourCycle: "h23"
  }).formatToParts(new Date());
  const get = t => parts.find(p => p.type === t).value;
  const day = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(get("weekday"));
  return { day, min: (+get("hour")) * 60 + (+get("minute")) };
}
const toMin = s => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };

// 영업시간 기준 추정. 반환: {state: "open"|"soon"|"closed", text}
function scheduleStatus(stall, now) {
  if (!stall.hours) return { state: "closed", text: "영업시간 미등록" };
  const today = stall.hours[now.day];
  const yday = stall.hours[(now.day + 6) % 7];
  if (yday) {
    const o = toMin(yday[0]), c = toMin(yday[1]);
    if (c < o && now.min < c) return closingText(c - now.min, yday[1]);
  }
  if (today) {
    const o = toMin(today[0]), c = toMin(today[1]);
    const overnight = c < o;
    if (now.min >= o && (overnight || now.min < c)) {
      return closingText(overnight ? (1440 - now.min + c) : (c - now.min), today[1]);
    }
    if (now.min < o) {
      const wait = o - now.min;
      if (wait <= 60) return { state: "soon", text: `${wait}분 뒤 오픈 (${today[0]})` };
      return { state: "closed", text: `오늘 ${today[0]} 오픈` };
    }
  }
  for (let i = 1; i <= 7; i++) {
    const d = (now.day + i) % 7, h = stall.hours[d];
    if (h) return { state: "closed", text: `${i === 1 ? "내일" : DAYS[d] + "요일"} ${h[0]} 오픈` };
  }
  return { state: "closed", text: "영업 정보 없음" };
}
function closingText(left, closeAt) {
  if (left <= 30) return { state: "soon", text: `곧 마감 (${closeAt}까지)` };
  return { state: "open", text: `영업중 · ${closeAt}까지` };
}

// ---- 손님 제보 ----
// SUPABASE_URL과 SUPABASE_ANON_KEY를 채우면 제보가 서버에 저장되어 모든 방문자와 공유돼요.
// 비워 두면 지금처럼 이 브라우저에만 저장(localStorage)해요.
const SUPABASE_URL = "https://qzisdwtstsicpjqvynyf.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_cJEqZcwTtoUDYUz4w-HUFg_Xb0YGxEM";  // publishable 키 (공개돼도 되는 키)
const REMOTE = !!(SUPABASE_URL && SUPABASE_ANON_KEY);
let remoteReports = {};  // { stallId: [{open, at}] }

// 예전 anon 키(eyJ...)는 Bearer로도 보내고, 새 publishable 키(sb_publishable_...)는 apikey 헤더만 써요.
function authHeaders() {
  const h = { apikey: SUPABASE_ANON_KEY };
  if (SUPABASE_ANON_KEY.startsWith("eyJ")) h.Authorization = `Bearer ${SUPABASE_ANON_KEY}`;
  return h;
}
async function fetchRemote() {
  if (!REMOTE) return;
  const since = new Date(Date.now() - 24 * 3600 * 1000).toISOString();
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/reports?select=stall_id,is_open,created_at&created_at=gte.${since}&order=created_at.desc&limit=2000`,
      { headers: authHeaders() });
    if (!r.ok) throw new Error(r.status);
    const next = {};
    for (const row of await r.json()) (next[row.stall_id] = next[row.stall_id] || []).push({ open: row.is_open, at: Date.parse(row.created_at) });
    remoteReports = next;
  } catch (e) { console.warn("제보 불러오기 실패", e); }
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/stalls?select=*&order=created_at.desc&limit=2000`, { headers: authHeaders() });
    if (!r.ok) throw new Error(r.status);
    userStalls = (await r.json()).map(rowToStall);
    rebuildStalls();
  } catch (e) { console.warn("가게 불러오기 실패", e); }
}
function rowToStall(r) {
  return { id: r.id, name: r.name, area: r.area || "", lat: r.lat, lng: r.lng, types: r.types,
           menu: r.menu || "", pay: r.pay || "", hours: r.hours || null, createdAt: Date.parse(r.created_at) };
}
async function sendRemote(stallId, open) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/reports`, {
    method: "POST",
    headers: { ...authHeaders(),
               "Content-Type": "application/json", Prefer: "return=minimal" },
    body: JSON.stringify({ stall_id: stallId, is_open: open }),
  });
  if (!r.ok) throw new Error(r.status);
}

const FRESH_MIN = 120;  // 이 시간 안의 제보는 영업시간보다 우선
const STORE_KEY = "winter-snack-reports-v1";
function loadMine() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch { return {}; }
}
function saveMine(m) { try { localStorage.setItem(STORE_KEY, JSON.stringify(m)); } catch {} }
let myReports = loadMine();
function reportsFor(id) {
  const src = REMOTE ? (remoteReports[id] || []) : (myReports[id] || []);
  return [...src].sort((a, b) => b.at - a.at);
}
function ago(ts) {
  const m = Math.max(0, Math.round((Date.now() - ts) / 60000));
  if (m < 1) return "방금";
  if (m < 60) return `${m}분 전`;
  if (m < 60 * 24) return `${Math.floor(m / 60)}시간 전`;
  return `${Math.floor(m / 1440)}일 전`;
}

// 제보 + 영업시간을 합친 최종 상태
function status(stall, now) {
  const sched = scheduleStatus(stall, now);
  const reps = reportsFor(stall.id);
  const latest = reps[0];
  const fresh = latest && (Date.now() - latest.at) / 60000 <= FRESH_MIN;
  if (fresh) {
    return {
      state: latest.open ? "open" : "closed",
      text: latest.open ? "영업중 (제보)" : "닫힘 (제보)",
      report: `🙋 ${ago(latest.at)} 손님 제보: ${latest.open ? "열려 있어요" : "닫혀 있어요"}`,
      fresh: true, sched,
    };
  }
  return {
    ...sched, sched,
    report: latest ? `마지막 제보 ${ago(latest.at)} (${latest.open ? "열림" : "닫힘"}) · 영업시간 기준 추정` : "아직 제보 없음 · 영업시간 기준 추정",
    fresh: false,
  };
}

// ---- 지도 ----
const map = L.map("map", { zoomControl: true }).setView([37.545, 126.98], 12);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

const markers = {};
let filterType = "all", openOnly = false, query = "", userPos = null, activeId = null;

function icon(stall, st) {
  const emoji = filterType !== "all" && stall.types.includes(filterType) ? EMOJI[filterType] : (EMOJI[stall.types[0]] || "📍");
  return L.divIcon({ className: "", html: `<div class="pin ${st.state}"><span>${emoji}</span></div>`,
    iconSize: [30, 30], iconAnchor: [15, 30], popupAnchor: [0, -28] });
}
function distKm(a, b) {
  const R = 6371, r = x => x * Math.PI / 180;
  const dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
  const h = Math.sin(dLat/2)**2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

function hoursTable(stall, now) {
  if (!stall.hours) return `<div class="hours">영업시간이 아직 등록되지 않았어요. 가게 앞이라면 아래에서 영업 여부를 알려 주세요.</div>`;
  return `<table class="hours">` + [1,2,3,4,5,6,0].map(d => {
    const h = stall.hours[d];
    return `<tr class="${d === now.day ? "today" : ""}"><td>${DAYS[d]}</td><td>${h ? h[0] + " – " + h[1] : "휴무"}</td></tr>`;
  }).join("") + "</table>";
}
function reportBox(stall, st) {
  const recent = reportsFor(stall.id).slice(0, 4);
  return `<div class="report-box">
    <div class="q">지금 이 가게 앞이세요? 영업 여부를 알려주세요.</div>
    <button class="yes" data-report="${stall.id}" data-open="1">🟢 지금 열려 있어요</button>
    <button class="no" data-report="${stall.id}" data-open="0">⚪ 지금 닫혀 있어요</button>
    ${recent.length ? `<ul>${recent.map(r => `<li>${ago(r.at)} · ${r.open ? "열림" : "닫힘"}</li>`).join("")}</ul>` : ""}
    ${st.fresh ? `<div class="meta">영업시간 기준으로는: ${st.sched.text}</div>` : ""}
  </div>`;
}

function renderCats() {
  const el = document.getElementById("cats");
  el.innerHTML = [`<button class="chip" data-type="all" aria-pressed="${filterType === "all"}">전체</button>`,
    ...CATS.map(c => `<button class="chip" data-type="${c.key}" aria-pressed="${filterType === c.key}">${c.e} ${c.key}</button>`)].join("");
  el.querySelectorAll("[data-type]").forEach(b => b.addEventListener("click", () => {
    filterType = b.dataset.type; renderCats(); render();
  }));
}

function render() {
  const now = kstNow();
  const hh = String(Math.floor(now.min / 60)).padStart(2, "0"), mm = String(now.min % 60).padStart(2, "0");
  document.getElementById("now").textContent = `(지금 ${DAYS[now.day]}요일 ${hh}:${mm}, 한국 시간)`;

  let rows = STALLS.map(s => ({ s, st: status(s, now), d: userPos ? distKm(userPos, s) : null }));
  rows = rows.filter(({ s, st }) =>
    (filterType === "all" || s.types.includes(filterType)) &&
    (!openOnly || st.state !== "closed") &&
    (!query || (s.name + s.area + s.menu + s.types.join("")).includes(query)));
  const rank = { open: 0, soon: 1, closed: 2 };
  rows.sort((a, b) => userPos ? a.d - b.d
    : rank[a.st.state] - rank[b.st.state] || (b.st.fresh - a.st.fresh) || a.s.name.localeCompare(b.s.name, "ko"));

  Object.values(markers).forEach(m => map.removeLayer(m));
  for (const k in markers) delete markers[k];
  rows.forEach(({ s, st }) => {
    const m = markers[s.id] = L.marker([s.lat, s.lng], { icon: icon(s, st) }).addTo(map);
    m.bindPopup(`<b>${esc(s.name)}</b><br>${st.text}<br><small>${esc(st.report)}</small><br><small>${esc(s.menu)}</small>`);
    m.on("click", () => select(s.id, false));
  });

  const openCount = rows.filter(r => r.st.state !== "closed").length;
  const label = filterType === "all" ? "" : `${EMOJI[filterType]} ${filterType} · `;
  const list = document.getElementById("list");
  list.innerHTML = `<div class="summary">${label}${rows.length}곳 중 ${openCount}곳 영업중${userPos ? " · 가까운 순" : ""}</div>` +
    (rows.length ? rows.map(({ s, st, d }) => `
      <div class="card ${s.id === activeId ? "active" : ""}" data-id="${s.id}">
        <div class="top"><h3>${esc(s.name)}</h3><span class="badge ${st.state}">${st.text}</span></div>
        <div class="reportline ${st.fresh ? "" : "stale"}">${esc(st.report)}</div>
        <div class="meta">${esc(s.area)}${d != null ? ` · ${d < 1 ? Math.round(d * 1000) + "m" : d.toFixed(1) + "km"}` : ""}${s.menu ? `<br>${esc(s.menu)}` : ""}</div>
        <div class="tags">${s.createdAt && Date.now() - s.createdAt < 7 * 86400000 ? `<span class="tag new">새로 등록</span>` : ""}${s.types.map(t => `<span class="tag">${EMOJI[t] || ""} ${esc(t)}</span>`).join("")}${s.pay ? `<span class="tag">${esc(s.pay)}</span>` : ""}</div>
        <div class="detail">${hoursTable(s, now)}${reportBox(s, st)}</div>
      </div>`).join("")
    : `<div class="empty">조건에 맞는 가게가 없어요.</div>`);
  list.querySelectorAll(".card").forEach(el => el.addEventListener("click", () => select(+el.dataset.id, true)));
  list.querySelectorAll("[data-report]").forEach(b => b.addEventListener("click", async e => {
    e.stopPropagation();
    const id = +b.dataset.report, open = b.dataset.open === "1";
    const last = lastSent[id];
    if (last && Date.now() - last < 60 * 1000) { toast("같은 가게는 1분에 한 번만 제보할 수 있어요."); return; }
    lastSent[id] = Date.now();
    if (REMOTE) {
      try { await sendRemote(id, open); (remoteReports[id] = remoteReports[id] || []).push({ open, at: Date.now() }); }
      catch { delete lastSent[id]; toast("제보를 보내지 못했어요. 잠시 뒤 다시 시도해 주세요."); return; }
    } else {
      (myReports[id] = myReports[id] || []).push({ open, at: Date.now() });
      saveMine(myReports);
    }
    toast("제보 고마워요! 다른 손님들에게 도움이 돼요.");
    render();
  }));
}

function select(id, fromList) {
  activeId = activeId === id && fromList ? null : id;
  const s = STALLS.find(x => x.id === id);
  if (fromList && activeId) { map.setView([s.lat, s.lng], 15); }
  render();
  if (fromList && activeId) markers[id]?.openPopup();
  if (!fromList) document.querySelector(`.card[data-id="${id}"]`)?.scrollIntoView({ block: "nearest", behavior: "smooth" });
}
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2000);
}

// ---- 컨트롤 ----
document.getElementById("openOnly").addEventListener("click", e => {
  openOnly = !openOnly; e.currentTarget.setAttribute("aria-pressed", openOnly); render();
});
document.getElementById("q").addEventListener("input", e => { query = e.target.value.trim(); render(); });
document.getElementById("locate").addEventListener("click", e => {
  const btn = e.currentTarget;
  if (userPos) { userPos = null; btn.setAttribute("aria-pressed", false); render(); return; }
  if (!navigator.geolocation) { btn.textContent = "📍 위치 기능 없음"; return; }
  navigator.geolocation.getCurrentPosition(p => {
    userPos = { lat: p.coords.latitude, lng: p.coords.longitude };
    btn.setAttribute("aria-pressed", true);
    L.circleMarker([userPos.lat, userPos.lng], { radius: 7, color: "#2a6df4", fillOpacity: .9 }).addTo(map);
    map.setView([userPos.lat, userPos.lng], 14);
    render();
  }, () => btn.textContent = "📍 위치 권한 필요");
});


// ---- 가게 등록 ----
const LOCAL_STALLS_KEY = "winter-snack-stalls-v1";
if (!REMOTE) {
  try { userStalls = JSON.parse(localStorage.getItem(LOCAL_STALLS_KEY)) || []; } catch { userStalls = []; }
  rebuildStalls();
}
let picking = false, picked = null, pickMarker = null, lastStallSent = 0;
const $ = id => document.getElementById(id);
$("fTypes").innerHTML = CATS.map(c => `<label><input type="checkbox" value="${c.key}">${c.e} ${c.key}</label>`).join("");
$("fOff").innerHTML = [1,2,3,4,5,6,0].map(d => `<label><input type="checkbox" value="${d}">${DAYS[d]}</label>`).join("");
$("stallForm").addEventListener("input", () => { $("fErr").textContent = ""; });
$("fNoHours").addEventListener("change", e => { $("hoursBox").style.display = e.target.checked ? "none" : ""; });

function startPick() {
  picking = true; document.body.classList.add("picking"); $("pickBanner").classList.add("show");
  $("modal").classList.remove("show");
}
function stopPick() {
  picking = false; document.body.classList.remove("picking"); $("pickBanner").classList.remove("show");
}
function setPicked(lat, lng) {
  picked = { lat, lng };
  if (pickMarker) map.removeLayer(pickMarker);
  pickMarker = L.marker([lat, lng], { icon: L.divIcon({ className: "", html: `<div class="pin soon"><span>＋</span></div>`, iconSize: [30, 30], iconAnchor: [15, 30] }) }).addTo(map);
  stopPick();
  $("pickedAt").textContent = `선택한 위치: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
  $("fErr").textContent = "";
  $("modal").classList.add("show");
  $("fName").focus();
}
function closeForm() {
  $("modal").classList.remove("show"); stopPick();
  if (pickMarker) { map.removeLayer(pickMarker); pickMarker = null; }
}
$("addStall").addEventListener("click", startPick);
$("pickCancel").addEventListener("click", closeForm);
$("fCancel").addEventListener("click", closeForm);
$("fRepick").addEventListener("click", startPick);
$("pickMine").addEventListener("click", () => {
  if (!navigator.geolocation) { toast("이 브라우저는 위치 기능이 없어요. 지도를 눌러 주세요."); return; }
  navigator.geolocation.getCurrentPosition(p => { map.setView([p.coords.latitude, p.coords.longitude], 17); setPicked(p.coords.latitude, p.coords.longitude); },
    () => toast("위치 권한이 없어요. 지도를 눌러 주세요."));
});
map.on("click", e => { if (picking) setPicked(e.latlng.lat, e.latlng.lng); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && (picking || $("modal").classList.contains("show"))) closeForm(); });

function readForm() {
  const name = $("fName").value.trim();
  const types = [...$("fTypes").querySelectorAll("input:checked")].map(i => i.value);
  if (name.length < 2) return { err: "가게 이름을 2글자 이상 적어 주세요." };
  if (!types.length) return { err: "파는 것을 하나 이상 골라 주세요." };
  if (!picked) return { err: "위치를 먼저 찍어 주세요." };
  if (picked.lat < 33 || picked.lat > 39 || picked.lng < 124 || picked.lng > 132) return { err: "지금은 국내 가게만 등록할 수 있어요." };
  let hours = null;
  if (!$("fNoHours").checked) {
    const o = $("fOpen").value, c = $("fClose").value;
    if (!o || !c || o === c) return { err: "여는 시간과 닫는 시간을 확인해 주세요." };
    const off = [...$("fOff").querySelectorAll("input:checked")].map(i => +i.value);
    if (off.length === 7) return { err: "모든 요일을 쉬는 날로 고를 수는 없어요." };
    hours = [0,1,2,3,4,5,6].map(d => off.includes(d) ? null : [o, c]);
  }
  return { row: {
    name, area: $("fArea").value.trim() || null, lat: +picked.lat.toFixed(6), lng: +picked.lng.toFixed(6), types,
    menu: $("fMenu").value.trim() || null,
    pay: [...$("fPay").querySelectorAll("input:checked")].map(i => i.value).join("·") || null,
    hours,
  } };
}
$("stallForm").addEventListener("submit", async e => {
  e.preventDefault();
  const { err, row } = readForm();
  if (err) { $("fErr").textContent = err; return; }
  if (Date.now() - lastStallSent < 5 * 60 * 1000) { $("fErr").textContent = "가게 등록은 5분에 한 번만 할 수 있어요."; return; }
  $("fSubmit").disabled = true;
  try {
    let stall;
    if (REMOTE) {
      const r = await fetch(`${SUPABASE_URL}/rest/v1/stalls`, {
        method: "POST",
        headers: { ...authHeaders(), "Content-Type": "application/json", Prefer: "return=representation" },
        body: JSON.stringify(row),
      });
      if (!r.ok) throw new Error(r.status + " " + await r.text());
      stall = rowToStall((await r.json())[0]);
    } else {
      stall = rowToStall({ ...row, id: 900000 + userStalls.length + 1, created_at: new Date().toISOString() });
      try { localStorage.setItem(LOCAL_STALLS_KEY, JSON.stringify([stall, ...userStalls])); } catch {}
    }
    lastStallSent = Date.now();
    userStalls = [stall, ...userStalls.filter(x => x.id !== stall.id)];
    rebuildStalls();
    $("stallForm").reset(); $("hoursBox").style.display = "";
    closeForm();
    filterType = "all"; renderCats();
    activeId = stall.id; render();
    map.setView([stall.lat, stall.lng], 16); markers[stall.id]?.openPopup();
    toast("등록 고마워요! 지도에 바로 올라갔어요.");
  } catch (ex) {
    console.warn("가게 등록 실패", ex);
    $("fErr").textContent = "등록하지 못했어요. 잠시 뒤 다시 시도해 주세요.";
  } finally { $("fSubmit").disabled = false; }
});

const lastSent = {};
renderCats();
render();
fetchRemote().then(render);
setInterval(async () => { await fetchRemote(); render(); }, 60 * 1000);
</script>
</body>
</html>
